<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>P1 - Simple Form Page</title>
</head>
<body>
  <h1>Newsletter Sign-Up</h1>

  <img src="promo-banner.jpg">
  <img src="logo.png" alt="Company logo">

  <form>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email">

    <input id="name" name="name" type="text">

    <input id="phone" name="phone" type="tel" aria-label="Phone number">

    <button></button>

    <button type="submit">Subscribe</button>
  </form>

  <p>
    To learn more about our privacy policy,
    <a href="/privacy">click here</a>.
  </p>

  <p>
    <a href="/pricing">View pricing details</a>
  </p>
</body>
</html>
